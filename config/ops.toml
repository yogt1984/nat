# Operational monitoring daemons (T0b).

[gap_alert]
# Page if no new feature data has been written for longer than this.
#
# MUST stay above the writer's file-close cadence, which is `rotate_interval` in
# ing.toml (currently "10m" = 600s). Freshness here is the newest *.parquet /
# *.parquet.tmp MTIME, and the open .tmp sits at size 0 because ArrowWriter buffers
# internally — so the mtime only advances when a file is CLOSED, i.e. every ~600s.
#
# The old 300s value was below that cadence and produced a self-sustaining restart
# loop: gap declared at 300s -> auto_restart fires -> 600s cooldown -> gap declared
# again. 300 + 600 = 900s, which is exactly the 15-minute restart period measured in
# logs/ingestor_*.log from 2026-07-26 to 2026-08-11 (~96 restarts/day, every one a
# clean `nat stop && nat start`, no crash). The comment it replaced asserted 300s sat
# "comfortably above the writer's flush cadence" — true when rotate_interval was "1h"
# and the .tmp mtime advanced on each ~5.5-min row-group flush, false since the
# 2026-06-19 change to 10m rotation.
#
# The cost of that loop was not the restarts themselves: in-memory warmup buffers reset
# on every one, so `regime_` (which needs 60 continuous minute-bars via
# regime_buffer.is_ready()) never matured and all 31 columns stayed NaN for 16 days.
# See FINDINGS §7.11 / BUG-6.
#
# 900s = 600s cadence + 300s headroom. Raise `rotate_interval` and this must follow.
gap_threshold_s = 900
poll_interval_s = 30

# Dirs watched for freshness (newest *.parquet OR *.parquet.tmp mtime wins).
data_dirs = ["data/features"]

# T4: row-timestamp freshness, surfaced in gap state / `nat status` as a
# diagnostic (newest readable row's age from closed-file footer stats). NOT a
# standalone trigger: closed-file stats lag up to a full hourly rotation, so they
# would false-alarm right after every rotation/restart. The gap trigger stays on
# the freshest-file mtime (which includes the live .parquet.tmp). Reserved for a
# future .tmp size-delta stalled-buffer check.
row_threshold_s = 600

# State + liveness files.
state_path     = "data/ops/gap_state.json"
heartbeat_path = "data/ops/gap_alert.heartbeat"
pid_file       = "data/ops/gap_alert.pid"

# Local fallback alert sink — always written even without Telegram, so a gap is
# never invisible. `nat status` reads gap_state.json; this is the durable log.
alert_log      = "data/ops/alerts.log"

# Intentional-pause marker. `nat stop` writes it (expected shutdown → no page);
# `nat start` clears it. The gap daemon keeps RUNNING either way, so an
# *unexpected* ingestor death (no marker) still alerts.
pause_file     = "data/ops/ingestion_paused"

# Stalled-buffer (zombie ingestor) detection + remediation. systemd's
# Restart=always can't catch a process that's alive but not writing; this watches
# the active .parquet.tmp's size. If mtime stays fresh but size doesn't grow for
# longer than stall_threshold_s (~3 row-group flush cycles), it's a stall.
stall_threshold_s = 900
# On a stall (or a plain mtime gap when there's no systemd unit), restart the
# ingestor — a systemd-managed box restarts restart_unit; a bare (cron-launched)
# box restarts via `nat stop && nat start`. Guarded by a cooldown and a
# max-consecutive cap so it can't restart-loop. (systemd boxes still defer a plain
# dead-process gap to Restart=always; gap_alert only forces it when unmanaged.)
auto_restart            = true
restart_unit            = "nat-ingestor.service"
restart_cooldown_s      = 600
max_consecutive_restarts = 3
