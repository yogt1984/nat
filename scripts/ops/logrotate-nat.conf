# nat log rotation (task 02 / REDUCED_SPECS B0). Run by nat-logrotate.timer as
# the user: logrotate -s ~/.local/state/logrotate-nat.status <this file>
# copytruncate: the ingestor and gap daemon hold their log fds open.
/home/onat/nat/logs/cron_restart.log
/home/onat/nat/logs/gap_alert.log {
    size 50M
    rotate 3
    compress
    copytruncate
    missingok
    notifempty
}
